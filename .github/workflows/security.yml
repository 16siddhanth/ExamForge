name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 1-31/2 * *'  # Every 2 days

permissions:
  contents: read  # ✅ Read-only; avoids PR/issue creation
  security-events: write  # Needed for CodeQL to upload results

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        command: test
        args: --severity-threshold=high

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript,typescript
        queries: security-extended

    - name: Perform CodeQL Analysis
      id: codeql-analyze
      uses: github/codeql-action/analyze@v3
      continue-on-error: true

    - name: Check CodeQL status
      if: always()
      run: |
        if [ "${{ steps.codeql-analyze.outcome }}" != "success" ]; then
          echo "::warning ::CodeQL analysis failed but workflow is continuing."
        else
          echo "CodeQL analysis succeeded."
        fi

    - name: Run npm audit
      run: npm audit
      continue-on-error: true

    - name: Check for secrets in code
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run OWASP ZAP Scan
      uses: zaproxy/action-full-scan@v0.7.0
      with:
        target: ${{ secrets.PRODUCTION_URL }}
        fail_action: false  # Don’t fail on warnings

    - name: Upload ZAP HTML Report
      uses: actions/upload-artifact@v4
      with:
        name: zap-html-report
        path: report_html.html

    - name: Upload ZAP Markdown Report
      uses: actions/upload-artifact@v4
      with:
        name: zap-md-
