name: Minimal Build Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  sanity-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install
        continue-on-error: true

      - name: Build Project
        run: npm run build
        continue-on-error: true

      - name: Start App and Check Availability
        run: |
          npm run preview &
          sleep 10
          curl -I http://localhost:4173 || echo "::warning ::App did not respond"
        continue-on-error: true
